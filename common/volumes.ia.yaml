volumes:

  flualfadata:
    name: flualfadata
    external: true

  fabdata:
    name: fabdata
    driver: external

  certificates:
    name: certificates
    driver: local

  jupyterdata:
    name: jupyterdata
    external: true

  jupytershared:
    name: jupytershared
    external: true

  jupyteracd:
    name: jupyteracd
    driver: local
    driver_opts:
      type: none
      device: /volumes/jupyteracd/_data
      o: bind

  jupyteracdiec:
    name: jupyteracdiec
    driver: local
    driver_opts:
      type: none
      device: /volumes/jupyteracdiec/_data
      o: bind

  traefikdata:
    name: traefikdata
    driver: local

  kesdata:
    name: kesdata
    driver: local

  vaultdata:
    name: vaultdata
    driver: local
