<VirtualHost *:80>
  
    ServerName ${LAB_DOMAIN}

    Protocols http/1.1 h2

    RedirectMatch permanent ^/(.*)$ https://${LAB_DOMAIN}/$1

</VirtualHost>


<VirtualHost *:443>
  
    ServerName ${LAB_DOMAIN}

    Protocols http/1.1 h2

    Header always set Strict-Transport-Security "max-age=63072000"

    RequestHeader set "X-Forwarded-Proto" expr=%{REQUEST_SCHEME}
    RequestHeader set "X-Forwarded-SSL" expr=%{HTTPS}
    
    SSLEngine on
    SSLCertificateFile "certificates/live/${LAB_DOMAIN}/fullchain.pem"
    SSLCertificateKeyFile "certificates/live/${LAB_DOMAIN}/privkey.pem"

    RewriteEngine On
    RewriteCond %{HTTP:CONNECTION} ^Upgrade$ [NC,OR]
    RewriteCond %{REQUEST_URI} !^/\.well\-known/acme\-challenge/

    ProxyPreserveHost On

    AllowEncodedSlashes NoDecode

    ErrorLog logs/error.log
    CustomLog logs/access.log combined

    ErrorDocument 404 /404.html
    ErrorDocument 503 /503.html

    <Directory /usr/local/apache2/htdocs>
        Options Indexes FollowSymLinks
        Allowoverride all
        Require all granted
    </Directory>

    ProxyPass /ita http://portal:3001
    ProxyPassReverse /ita http://portal:3001

    ProxyPass /inovalab http://inovalab:3002
    ProxyPassReverse /inovalab http://inovalab:3002
    
</VirtualHost>
